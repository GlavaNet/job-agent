# ---------------------------------------------------------------------------
# job-agent — Docker Compose stack (host llama-server variant)
#
# This is a variant of the standard compose.yaml for installs that run
# their own OpenAI-compatible LLM backend on the HOST rather than using
# the bundled `ollama` container — e.g. llama.cpp's `llama-server`. See
# README.md > "Using an external LLM backend on the host" for the full
# explanation of why this variant exists and what it changes.
#
# Summary of the difference from the standard compose.yaml:
#   - No `ollama` / `ollama-pull` services or `ollama-models` volume.
#   - Every service's LLM_BASE_URL points at host.docker.internal, which
#     resolves to the Docker bridge gateway IP via `extra_hosts` below.
#   - The `default` network's subnet is PINNED (see `ipam:` below)
#     instead of left to Compose's auto-assignment. This is the actual
#     fix for the host-networking problem: on Linux, Docker Compose
#     creates a bridge interface with an auto-generated name
#     (br-<hash>) that changes on every `docker compose down` + fresh
#     `up` (not every restart — only when the network itself is
#     recreated). Any host firewall rule written against that
#     interface name (ufw, iptables -I DOCKER-USER, etc.) silently
#     breaks the next time the network is recreated. Pinning the
#     subnet here means the firewall rule can match on a stable CIDR
#     instead of an unstable interface name, and never needs to be
#     rewritten again.
#
# See README.md for the one-time host firewall setup this variant
# requires (ufw + iptables DOCKER-USER rule) — Compose alone cannot
# open host firewall ports; that step still has to happen once, outside
# Docker, on the host.
#
# --- Path layout ------------------------------------------------------
# config.py, database.py, job_cache.py, and preference_engine.py all
# resolve their file paths through JOBAGENT_DATA_DIR (env var, defaults
# to "." for bare-metal compatibility — see config.py). Every service
# below sets it to /app/state, a plain bind-mounted directory from the
# host's ./data.
#
# --- Build order --------------------------------------------------------
# Dockerfile.scheduler is FROM job-agent-slim:latest, and Compose does
# not track that as a build dependency (it only tracks compose-level
# depends_on between running containers, not Dockerfile FROM references
# to another service's image). Build the slim image before the
# scheduler on a fresh checkout:
#
#   docker compose build dashboard      # produces job-agent-slim:latest
#   docker compose build                # builds everything else, incl. scheduler
#   docker compose up -d
#
# First-time setup on the host:
#   mkdir -p data/resume
#   cp /path/to/your/resume.pdf data/resume/resume.pdf
#   cp .env.example .env   # fill in secrets, set LLM_BASE_URL (see README)
#   # then do the one-time firewall setup in README.md before `up`
#
# Everyday use:
#   docker compose logs -f dashboard
#   docker compose logs -f scheduler                        # cron output
#   docker compose exec runner python3 /app/job_agent.py    # one-off manual run
#   docker compose exec runner sh -c 'curl -X POST localhost:8888/run -H "Authorization: Bearer $RUNNER_SECRET"'
#   docker compose exec dashboard sqlite3 /app/state/jobs.db
# ---------------------------------------------------------------------------

x-jobagent-volumes: &jobagent-volumes
  - ./data:/app/state

# Every service needs this to resolve host.docker.internal on Linux —
# Docker Desktop (Mac/Windows) provides it automatically, but plain
# Docker Engine on Linux does not unless each service declares it.
x-extra-hosts: &host-gateway
  - "host.docker.internal:host-gateway"

services:

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-agent:latest
    container_name: job-agent-runner
    restart: unless-stopped
    command: ["python3", "/app/runner.py"]
    env_file: .env
    environment:
      JOBAGENT_DATA_DIR: /app/state
    extra_hosts: *host-gateway
    volumes: *jobagent-volumes
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8888/status').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # runner.py's /run endpoint is called by the scheduler container over
    # this docker network (http://runner:8888/run) — no port published
    # to the host unless you want to trigger it manually from outside.

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.slim
    image: job-agent-slim:latest
    container_name: job-agent-dashboard
    restart: unless-stopped
    command: ["python3", "/app/dashboard.py"]
    env_file: .env
    environment:
      JOBAGENT_DATA_DIR: /app/state
    extra_hosts: *host-gateway
    volumes: *jobagent-volumes
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  listener:
    build:
      context: .
      dockerfile: Dockerfile.slim
    image: job-agent-slim:latest
    container_name: job-agent-listener
    restart: unless-stopped
    command: ["python3", "/app/inbox_listener.py"]
    env_file: .env
    environment:
      JOBAGENT_DATA_DIR: /app/state
    extra_hosts: *host-gateway
    volumes: *jobagent-volumes

  # Replaces job-agent-autogen.timer AND n8n's "Job Agent Daily Run"
  # workflow (see Dockerfile.scheduler for both cron lines and the
  # original schedules they're matching).
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    image: job-agent-scheduler:latest
    container_name: job-agent-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      JOBAGENT_DATA_DIR: /app/state
    extra_hosts: *host-gateway
    volumes: *jobagent-volumes
    depends_on:
      runner:
        condition: service_healthy

networks:
  default:
    name: job-agent-net
    driver: bridge
    ipam:
      config:
        # Pinned so the bridge subnet never changes across
        # `docker compose down` + `up` cycles. This is what lets the
        # host firewall rule (see README) target a stable CIDR instead
        # of an auto-generated interface name that changes each time
        # the network is recreated. Pick any private /16 that doesn't
        # collide with your LAN, Tailscale range, or other Docker
        # networks on this host (check with `docker network ls` +
        # `docker network inspect <name>` before changing this).
        - subnet: 172.28.0.0/16
