<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Agent — Login</title>
    <style>
        :root {
            --bg-primary:   #f0f4f8;
            --bg-secondary: #ffffff;
            --text-primary: #2d3748;
            --text-muted:   #718096;
            --border:       #e2e8f0;
            --accent:       #2b6cb0;
            --error-bg:     #fff5f5;
            --error-border: #fc8181;
            --error-text:   #c53030;
            --shadow:       rgba(0,0,0,0.1);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary:   #1a202c;
                --bg-secondary: #2d3748;
                --text-primary: #e2e8f0;
                --text-muted:   #a0aec0;
                --border:       #4a5568;
                --accent:       #63b3ed;
                --error-bg:     #3d1515;
                --error-border: #9b2c2c;
                --error-text:   #fc8181;
                --shadow:       rgba(0,0,0,0.4);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            box-shadow: 0 4px 16px var(--shadow);
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
        }
        .logo {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 1.2rem;
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 28px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 0.95rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.15s;
        }
        input[type="password"]:focus {
            border-color: var(--accent);
        }
        .error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            border-radius: 7px;
            padding: 10px 14px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
        button {
            width: 100%;
            margin-top: 16px;
            padding: 11px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        button:hover { opacity: 0.88; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🤖</div>
        <h1>Job Agent</h1>
        <p class="subtitle">Enter your dashboard password to continue</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
            <input type="hidden" name="next" value="{{ next }}">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   autofocus autocomplete="current-password"
                   placeholder="Dashboard password">
            <button type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>
